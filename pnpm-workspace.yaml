  "fflate@>=0.7.0 <0.7.5": 0.7.5
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0

allowBuilds:
  core-js: true
  esbuild: true
  protobufjs: true
  sharp: true
  workerd: true
